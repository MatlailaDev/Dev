<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lesiba Matlaila Business card</title>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="card">

        <img class="avatar" src="images/linkedin_headshot_1.png">
    
        <div>
            <h3><a href="https://github.com/MatlailaDev" target="_blank" rel="noopener noreferrer">Macmillan Matlaila<i class="fa-brands fa-github"></i></a></h3>
            <p>Full-Stack Developer</p>
            <h4>Gauteng, South Africa</h4>
            <button id="stack-toggle" aria-expanded="false" aria-controls="wrapper"> View Stack</button>
        </div>

    </div>

    <div id="wrapper" hidden>
        <img class="stack-banner" src="images/website-banner_2.svg" alt="Full-stack developer and data visualizer tech stack">
    </div>

    <script src="script.js"></script>
