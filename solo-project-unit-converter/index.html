<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section>
        <div class="interface">
            <h2>Metric/Imperial Unit Conversion</h2>

            <input type="text">
            <div class="btn-container">
                <button>Convert</button>
            </div>
        </div>

        <div>
            <div class="result">
                <h4>Length(Meter/Feet)</h4>
                <div id="length"></div>
            </div>
            <div class="result">
                <h4>Volume(Liters/Gallons)</h4>
                <div id="volume"></div>
            </div>
            <div class="result">
                <h4>Mass(Kilograms/Pounds)</h4>
                <div id="mass"></div>
            </div>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
